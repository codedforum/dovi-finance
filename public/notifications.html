<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notifications. DOVI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f1e9">
<link rel="icon" href="/mark.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/dovi.css?v=dev">
<!--preload-->
<link rel="modulepreload" href="/js/api.js?v=dev">
<link rel="modulepreload" href="/js/format.js?v=dev">
<link rel="modulepreload" href="/js/ui.js?v=dev">
<link rel="modulepreload" href="/js/notify.js?v=dev">
<link rel="modulepreload" href="/js/notifications-page.js?v=dev">
<!--/preload-->
</head>
<body>
<header class="topbar"><div class="in"><a class="brand" href="/app"><img src="/mark.svg" alt="" width="32" height="32">DOVI</a><span class="sp"></span><a class="btn sm ghost" href="/app">Back to app</a></div></header>
<main class="shell" id="view" tabindex="-1">
  <h1 style="font-family:var(--serif);font-size:34px;margin:6px 2px 4px;letter-spacing:-.02em">Notifications</h1>
  <p class="hint" style="margin:0 2px 14px">Payments, claims and security updates.</p>
  <div class="seg" role="group" aria-label="Filter"><button type="button" data-g="" aria-pressed="true">All</button><button type="button" data-g="money" aria-pressed="false">Money</button><button type="button" data-g="claims" aria-pressed="false">Claims</button><button type="button" data-g="security" aria-pressed="false">Security</button></div>
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn sm ghost" id="mr" type="button">Mark all read</button></div>
  <div class="list" id="nl" aria-live="polite"></div>
  <div style="text-align:center;margin-top:16px"><button class="btn ghost" id="more" type="button" hidden>Load more</button></div>
</main>
<script type="module" src="/js/notifications-page.js?v=dev"></script>
<script type="module" src="/js/consent.js?v=dev"></script>
</body>
</html>
